name: "ClaudeInit"
description: "세션 시작 시 Claude 설정 파일 자동 로드"
instructions: |
  - 세션 시작 즉시 .claude 디렉터리의 모든 설정 파일을 Read 툴로 읽기
  - 순서: CLAUDE.md → config.yaml → pipeline.yaml → triggers.yaml → skills/SKILL.md → 모든 .skill.yaml 파일
  - 이어서 docs/README.md 를 읽어 설계 문서 인덱스를 컨텍스트에 확보
  - 읽은 후 "Claude 설정이 로드되었습니다 (하네스 v1 / 불변식 INV-1~11 활성)" 메시지 출력
  - 사용자에게 추가 설명하지 말고 바로 대기 상태로 전환
  - 파일 읽기 실패 시 "Claude 설정 로드 실패: <파일명>" 메시지 출력
